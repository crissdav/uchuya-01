<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uchuya Premium de Meilyng · Déjanos tu reseña</title>
  <meta name="description" content="Califica tu experiencia en Clínica Dental Uchuya Premium de Meilyng. Elige tu sede y déjanos tu reseña en Google.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/logo-uchuya.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo-uchuya.png">
  <link rel="preload" href="assets/logo-uchuya.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Fuentes sin bloquear el render: la página se muestra al instante con la fuente del sistema -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;600&display=swap" media="print" onload="this.media='all'">

  <link rel="modulepreload" href="js/sedes.js">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <header>
      <picture>
        <source srcset="assets/logo-uchuya.webp" type="image/webp">
        <img class="logo" src="assets/logo-uchuya.png" alt="Logo de Clínica Dental Uchuya Premium de Meilyng" width="192" height="192" fetchpriority="high" decoding="async">
      </picture>
      <span class="brand">Clínica Dental Uchuya Premium de Meilyng</span>
      <h1>Tu sonrisa, <em>tu opinión</em></h1>
      <p class="lead">Gracias por confiar en nosotros. Elige la sede donde te atendimos y cuéntanos tu experiencia en Google.</p>
      <div class="stars" aria-hidden="true">★★★★★</div>
    </header>

    <section class="grid" id="sedes" aria-label="Sedes"></section>

    <p class="note">Se abrirá Google Maps para que dejes tu calificación y reseña.</p>
  </main>

  <footer>© <span id="year"></span> Clínica Dental Uchuya Premium de Meilyng</footer>

  <template id="sede-template">
    <a class="card" target="_blank" rel="noopener">
      <span class="pin" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </span>
      <h2 class="card-title"></h2>
      <p class="card-address"></p>
      <span class="cta">
        Dejar mi reseña
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </template>
</body>
</html>
